<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Minimal Android Salute UI</title>
  <desc id="desc">Three wireframes for the PersonalHub Salute module: Recenti list, sample detail and medical journal detail.</desc>
  <defs>
    <style>
      .bg { fill: #F5F7F8; }
      .phone { fill: #FFFFFF; stroke: #263238; stroke-width: 4; rx: 34; }
      .bar { fill: #ECEFF1; }
      .card { fill: #FFFFFF; stroke: #B0BEC5; stroke-width: 2; rx: 14; }
      .chip { fill: #ECEFF1; stroke: #90A4AE; stroke-width: 1.5; rx: 18; }
      .chipOn { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 2; rx: 18; }
      .ai { fill: #F3E5F5; stroke: #7B1FA2; stroke-width: 2; rx: 14; }
      .warn { fill: #FFF3E0; stroke: #EF6C00; stroke-width: 2; rx: 12; }
      .h1 { font: 700 28px sans-serif; fill: #263238; }
      .h2 { font: 700 21px sans-serif; fill: #263238; }
      .body { font: 400 17px sans-serif; fill: #455A64; }
      .small { font: 400 14px sans-serif; fill: #607D8B; }
      .tiny { font: 400 12px sans-serif; fill: #78909C; }
      .accent { fill: #2E7D32; font: 700 17px sans-serif; }
      .purple { fill: #6A1B9A; font: 700 15px sans-serif; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1500" height="980"/>
  <text x="60" y="58" class="h1" font-size="34">Salute — UI Android minima (read-only)</text>
  <text x="60" y="92" class="small">Obiettivo: consultazione rapida sul Pixel; Obsidian resta l'interfaccia primaria.</text>

  <!-- Phone 1 -->
  <rect class="phone" x="50" y="130" width="420" height="790"/>
  <rect class="bar" x="50" y="130" width="420" height="78" rx="30"/>
  <text x="82" y="178" class="h1">Salute</text>
  <text x="405" y="178" text-anchor="end" class="small">read-only</text>

  <rect class="chipOn" x="78" y="230" width="88" height="36"/>
  <text x="122" y="253" text-anchor="middle" class="body">Recenti</text>
  <rect class="chip" x="176" y="230" width="82" height="36"/>
  <text x="217" y="253" text-anchor="middle" class="body">Esami</text>
  <rect class="chip" x="268" y="230" width="100" height="36"/>
  <text x="318" y="253" text-anchor="middle" class="body">Campioni</text>
  <rect class="chip" x="378" y="230" width="70" height="36"/>
  <text x="413" y="253" text-anchor="middle" class="body">Diario</text>

  <text x="78" y="304" class="small">VEN 18-9-26</text>
  <rect class="card" x="76" y="320" width="368" height="134"/>
  <text x="96" y="350" class="h2">Campione sangue</text>
  <text x="420" y="350" text-anchor="end" class="accent">12 test</text>
  <text x="96" y="382" class="body">1 fuori range · refertazione 1g 7h</text>
  <text x="96" y="411" class="small">Fosfatasi alcalina 114 ↑ · Hb 8.8 · B12 332</text>
  <text x="96" y="438" class="purple">Commento AI del campione disponibile</text>

  <rect class="card" x="76" y="472" width="368" height="136"/>
  <text x="96" y="502" class="h2">Consultazione psichiatrica</text>
  <text x="96" y="532" class="body">Digevej · Dr. Rossi</text>
  <text x="96" y="560" class="small">Traduzione italiana della nota clinica…</text>
  <text x="96" y="588" class="purple">Meta-parere AI disponibile</text>

  <text x="78" y="650" class="small">GIO 3-9-26</text>
  <rect class="card" x="76" y="666" width="368" height="118"/>
  <text x="96" y="696" class="h2">Tampone</text>
  <text x="96" y="726" class="body">Chlamydia · Negativo</text>
  <text x="96" y="754" class="small">Gola/retto</text>

  <text x="260" y="880" text-anchor="middle" class="tiny">Nessun FAB · nessun Add/Edit/Delete · sync globale PH</text>

  <!-- Phone 2 -->
  <rect class="phone" x="540" y="130" width="420" height="790"/>
  <rect class="bar" x="540" y="130" width="420" height="78" rx="30"/>
  <text x="572" y="178" class="h1">Campione</text>
  <text x="925" y="178" text-anchor="end" class="small">18-9-26</text>

  <text x="570" y="246" class="h2">Sangue · 08:21</text>
  <text x="570" y="276" class="body">Luogo: Digevej</text>
  <text x="570" y="304" class="body">12 risultati · 1 anomalia</text>

  <rect class="warn" x="568" y="330" width="364" height="82"/>
  <text x="590" y="362" class="h2">Turnaround</text>
  <text x="590" y="393" class="body">ultimo risultato: 1g 7h</text>

  <rect class="ai" x="568" y="432" width="364" height="146"/>
  <text x="590" y="464" class="h2">COMMENTO AI CAMPIONE</text>
  <text x="590" y="495" class="body">Quadro complessivamente stabile.</text>
  <text x="590" y="522" class="body">ALP lievemente alta, isolata…</text>
  <text x="590" y="553" class="small">basato sullo storico fino a questa data</text>

  <text x="570" y="622" class="h2">Risultati</text>
  <text x="570" y="655" class="body">Emoglobina</text><text x="925" y="655" text-anchor="end" class="body">8.8 mmol/L</text>
  <text x="570" y="687" class="body">Leucociti</text><text x="925" y="687" text-anchor="end" class="body">8.3 ×10⁹/L</text>
  <text x="570" y="719" class="body">Vitamina B12</text><text x="925" y="719" text-anchor="end" class="body">332 pmol/L</text>
  <text x="570" y="751" class="body">Fosfatasi alcalina</text><text x="925" y="751" text-anchor="end" class="accent">114 U/L ↑</text>

  <text x="750" y="880" text-anchor="middle" class="tiny">Tap su un risultato → storico + commento AI della misura</text>

  <!-- Phone 3 -->
  <rect class="phone" x="1030" y="130" width="420" height="790"/>
  <rect class="bar" x="1030" y="130" width="420" height="78" rx="30"/>
  <text x="1062" y="178" class="h1">Nota clinica</text>

  <text x="1060" y="246" class="body">Digevej · Dr. Rossi</text>
  <text x="1060" y="274" class="small">Consultazione psichiatrica</text>

  <text x="1060" y="320" class="h2">NOTA CLINICA</text>
  <rect class="card" x="1058" y="338" width="364" height="150"/>
  <text x="1080" y="370" class="body">Traduzione italiana fedele</text>
  <text x="1080" y="398" class="body">del testo scritto dal medico…</text>
  <text x="1080" y="460" class="tiny">Originale danese espandibile</text>

  <text x="1060" y="530" class="h2">META-PARERE AI</text>
  <rect class="ai" x="1058" y="548" width="364" height="176"/>
  <text x="1080" y="580" class="purple">Parzialmente concorde</text>
  <text x="1080" y="611" class="body">La conclusione è coerente con X,</text>
  <text x="1080" y="638" class="body">ma il dato Y suggerisce cautela…</text>
  <text x="1080" y="684" class="small">Incertezza: manca Z</text>

  <text x="1060" y="764" class="h2">COLLEGAMENTI</text>
  <rect class="chip" x="1060" y="782" width="96" height="34"/><text x="1108" y="804" text-anchor="middle" class="small">Dr. Rossi</text>
  <rect class="chip" x="1166" y="782" width="88" height="34"/><text x="1210" y="804" text-anchor="middle" class="small">Digevej</text>
  <rect class="chip" x="1264" y="782" width="128" height="34"/><text x="1328" y="804" text-anchor="middle" class="small">Duloxetina</text>

  <text x="1240" y="880" text-anchor="middle" class="tiny">I chip aprono People / Places / Substances via Hub Context</text>
</svg>