name: Salute module

on:
  push:
    branches: [main]
    paths:
      - 'feature/salute/**'
      - 'core/database/src/main/java/com/gernalix/personalhub/core/database/capsules/gitdata/GitReadOnlyArtifactClient.kt'
      - 'app/src/main/java/com/gernalix/personalhub/capsules/shortcuts/LauncherShortcutsCapsule.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/salute-module.yml'
  pull_request:
    paths:
      - 'feature/salute/**'
      - 'core/database/src/main/java/com/gernalix/personalhub/core/database/capsules/gitdata/GitReadOnlyArtifactClient.kt'
      - 'app/src/main/java/com/gernalix/personalhub/capsules/shortcuts/LauncherShortcutsCapsule.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/salute-module.yml'

permissions:
  contents: read

concurrency:
  group: personalhub-salute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compile Salute and run focused tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain \
            :feature:salute:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:compileDebugKotlin \
            checkArchitectureBoundaries
