name: Play Store preflight

on:
  push:
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'version.txt'
      - 'tools/check_play_manifest.py'
      - '.github/workflows/play-store-preflight.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'version.txt'
      - 'tools/check_play_manifest.py'
      - '.github/workflows/play-store-preflight.yml'

permissions:
  contents: read

concurrency:
  group: play-store-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate Play variant
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:processPlayMainManifest :app:lintPlay :app:testPlayUnitTest
      - name: Verify merged Play policy surface
        run: python3 tools/check_play_manifest.py
