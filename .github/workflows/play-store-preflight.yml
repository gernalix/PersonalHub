name: Play Store preflight

on:
  push:
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'version.txt'
      - 'tools/check_play_manifest.py'
      - 'tools/check_play_bundle.py'
      - 'docs/PRIVACY_POLICY.md'
      - '.github/workflows/play-store-preflight.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'version.txt'
      - 'tools/check_play_manifest.py'
      - 'tools/check_play_bundle.py'
      - 'docs/PRIVACY_POLICY.md'
      - '.github/workflows/play-store-preflight.yml'

permissions:
  contents: read

concurrency:
  group: play-store-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate and package Play variant
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon \
            :app:processPlayMainManifest \
            :app:lintPlay \
            :app:bundlePlay \
            -Ppersonalhub.allowUnsignedPlayBundle=true
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            report=$(find app/build -type f -name 'lint-results-play.txt' -print -quit 2>/dev/null || true)
            if [ -n "$report" ]; then
              echo '--- compact lint errors ---'
              grep -n -E '^[^ ]+:[0-9]+: Error:|^Error:' "$report" | head -50 || true
            fi
            exit "$rc"
          fi
      - name: Verify merged Play policy surface
        run: python3 tools/check_play_manifest.py
      - name: Verify Play App Bundle
        run: python3 tools/check_play_bundle.py
