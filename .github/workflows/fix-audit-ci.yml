name: PersonalHub audit remediation validation

on:
  push:
    branches: [fix/20261027-ph-audit-remediation]
    paths:
      - '.github/workflows/fix-audit-ci.yml'
      - 'app/**'
      - 'feature/**'
      - 'contracts/**'
      - 'core/**'

permissions:
  contents: read

concurrency:
  group: ph-audit-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GOOGLE_MAPS_API_KEY: CI_NOT_A_REAL_KEY
      GOOGLE_ROUTES_API_KEY: CI_NOT_A_REAL_KEY
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5.0.2
      - name: Check exact Kotlin consumers before first compile
        run: |
          python3 tools/android_consumer_preflight.py scan             --symbol placesInBoundingBoxPageBlocking             --symbol placesWithCoordinatesPageBlocking             --symbol GeoBoundingBox             --symbol FinanceBitmapSampling             --symbol checkedBankingNextPage
      - name: Compile highest application consumer
        run: ./gradlew --no-daemon --console=plain :app:compileDebugKotlin --quiet
      - name: Run impacted module tests and architecture gate
        run: ./gradlew --no-daemon --console=plain --parallel --max-workers=2 :feature:luoghi:testDebugUnitTest :feature:soldi:testDebugUnitTest :app:testDebugUnitTest checkArchitectureBoundaries --quiet
      - name: Preserve test XML for verification
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ph-audit-remediation-unit-xml
          path: |
            app/build/test-results/testDebugUnitTest/
            feature/luoghi/build/test-results/testDebugUnitTest/
            feature/soldi/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
