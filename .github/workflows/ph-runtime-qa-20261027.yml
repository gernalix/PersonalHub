name: PersonalHub isolated runtime and security diagnostics

on:
  push:
    branches: [audit/20261027-runtime-verification]
    paths:
      - .github/workflows/ph-runtime-qa-20261027.yml
      - app/src/androidTest/java/com/gernalix/personalhub/AutoExportRuntimeCostQaTest.kt
      - audit/20261027/runtime/**

permissions:
  contents: read

concurrency:
  group: ph-runtime-qa-20261027
  cancel-in-progress: true

jobs:
  runtime-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: CI_NOT_A_REAL_KEY
      GOOGLE_ROUTES_API_KEY: CI_NOT_A_REAL_KEY
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5.0.2
      - name: Prepare required Android native library stripper
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION"
          test -x "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
      - name: Build ONLY synthetic QA application and test APKs
        run: |
          ./gradlew --no-daemon --console=plain --max-workers=1 \
            :app:assembleQa :app:assembleQaAndroidTest \
            -Ppersonalhub.testBuildType=qa -Ppersonalhub.allowCiEmulatorDebug=true
      - name: Prepare runner KVM and Android dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libx11-xcb-dev
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated real export, startup and exported-component security checks
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          pre-emulator-launch-script: python3 tools/configure_ci_emulator.py
          disable-animations: true
          script: python3 audit/20261027/runtime/profile_android.py
      - name: Analyze the existing captured Perfetto trace without rerunning the device
        if: success()
        run: |
          python3 -m pip install --disable-pip-version-check perfetto
          python3 audit/20261027/runtime/analyze_capture.py
      - name: Publish inspectable results and trace
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: personalhub-runtime-20261027
          path: audit/20261027/runtime/results/
          if-no-files-found: warn
          retention-days: 7
