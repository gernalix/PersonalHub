name: one-shot-delete-obsolete-branches
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: one-shot branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged or superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads"
          for ref in "feature%2Fhybrid-datasette-explorer" "chatgpt%2Fandroid-diagnostics-efficiency"; do
            curl -fsS -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/${ref}"
          done
