name: Architecture boundaries

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'tools/check_architecture_boundaries.py'
      - 'tools/android_shortcut_alias_smoke.py'
      - 'docs/CAPSULE_BOUNDARIES.md'
      - '.github/workflows/architecture-boundaries.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'tools/check_architecture_boundaries.py'
      - 'docs/CAPSULE_BOUNDARIES.md'
      - '.github/workflows/architecture-boundaries.yml'

permissions:
  contents: read

concurrency:
  group: personalhub-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capsule-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Verify capsule boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile tools/check_architecture_boundaries.py tools/android_shortcut_alias_smoke.py
          python3 tools/check_architecture_boundaries.py
