name: Android instrumentation CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-instrumentation-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-instrumentation-ci.yml'

permissions:
  contents: read

concurrency:
  group: personalhub-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: CI_NOT_A_REAL_KEY
      GOOGLE_ROUTES_API_KEY: CI_NOT_A_REAL_KEY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PERSONALHUB_DATASETTE_RUNTIME_JSON: ${{ secrets.PERSONALHUB_DATASETTE_RUNTIME_JSON }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: timeout --signal=TERM --kill-after=2m 50m bash tools/run_ci_instrumentation.sh
