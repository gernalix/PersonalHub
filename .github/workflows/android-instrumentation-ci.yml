name: Android instrumentation CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-instrumentation-ci.yml'
      - 'tools/run_ci_instrumentation.sh'
  pull_request:
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-instrumentation-ci.yml'
      - 'tools/run_ci_instrumentation.sh'

permissions:
  contents: read

concurrency:
  group: personalhub-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'physical-device-only')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: CI_NOT_A_REAL_KEY
      GOOGLE_ROUTES_API_KEY: CI_NOT_A_REAL_KEY
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare KVM and emulator libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libx11-xcb-dev
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: timeout --signal=TERM --kill-after=2m 50m bash tools/run_ci_instrumentation.sh
      - name: Preserve failed app instrumentation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-instrumentation-diagnostics
          path: build/ci-instrumentation-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
