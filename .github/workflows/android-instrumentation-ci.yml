name: Android instrumentation CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-instrumentation-ci.yml'
      - 'tools/run_ci_instrumentation.sh'
  pull_request:
    paths:
      - 'app/**'
      - 'contracts/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-instrumentation-ci.yml'
      - 'tools/run_ci_instrumentation.sh'

permissions:
  contents: read

concurrency:
  group: personalhub-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'physical-device-only')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: CI_NOT_A_REAL_KEY
      GOOGLE_ROUTES_API_KEY: CI_NOT_A_REAL_KEY
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare native-library stripping
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION"
          test -x "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
      - name: Build instrumentation APKs before starting the emulator
        run: |
          timeout --signal=TERM --kill-after=2m 18m ./gradlew --no-daemon --console=plain --warning-mode=all --max-workers=1 \
            :app:assembleQa :app:assembleQaAndroidTest \
            -Ppersonalhub.testBuildType=qa -Ppersonalhub.allowCiEmulatorDebug=true
          timeout --signal=TERM --kill-after=2m 18m ./gradlew --no-daemon --console=plain --warning-mode=all --max-workers=1 \
            :feature:luoghi:assembleDebugAndroidTest \
            :feature:multitimetracker:assembleDebugAndroidTest \
            :core:database:assembleDebugAndroidTest \
            -Ppersonalhub.allowCiEmulatorDebug=true
      - name: Prepare KVM and emulator libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libx11-xcb-dev
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # This self-contained suite needs Android APIs, not Google services.
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          # Preserve the Pixel 6 logical viewport (411x914dp) while rendering
          # 4/9 as many pixels. Both stock launchers have missed first draw on
          # the software-rendered runner before any app instrumentation starts.
          pre-emulator-launch-script: |
            python3 - <<'PY'
            import os
            from pathlib import Path
            config = Path(os.environ["ANDROID_AVD_HOME"]) / "test.avd" / "config.ini"
            updates = {"hw.lcd.width": "720", "hw.lcd.height": "1600", "hw.lcd.density": "280",
                       "skin.name": "720x1600", "skin.path": "_no_skin", "skin.dynamic": "yes"}
            lines = [line for line in config.read_text().splitlines()
                     if line.split("=", 1)[0].strip() not in updates]
            config.write_text("\n".join(lines + [f"{key}={value}" for key, value in updates.items()]) + "\n")
            PY
          disable-animations: true
          script: timeout --signal=TERM --kill-after=2m 50m bash tools/run_ci_instrumentation.sh
      - name: Preserve failed app instrumentation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-instrumentation-diagnostics
          path: build/ci-instrumentation-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
