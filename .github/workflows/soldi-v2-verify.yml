name: Soldi v2 verify

on:
  push:
    branches:
      - feature/soldi-ui-v2
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        run: yes | sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Verify architecture boundaries
        run: ./gradlew --no-daemon checkArchitectureBoundaries

      - name: Compile app and run focused unit tests
        run: ./gradlew --no-daemon :app:compileDebugKotlin :core:database:testDebugUnitTest :feature:soldi:testDebugUnitTest

      - name: Show generated Room schema state
        if: always()
        run: |
          git status --short core/database/schemas || true
          find core/database/schemas -path '*/12.json' -print || true
