name: Temporary branch cleanup

on:
  push:
    branches:
      - main
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  delete-non-main-branches:
    if: github.event_name == 'push' || github.event.issue.title == '[internal] PersonalHub branch cleanup trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Delete consolidated branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/places-accuracy-aware-checkin" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/startup-defer-legacy-timer-repair" || true
